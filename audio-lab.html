<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; --bg: #1d1f23; --panel: #26292e; --line: #3a3e45; --text: #ecedef; --muted: #9aa0a8; --accent: #f5c518; --warn: #ff7a59; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
      main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
      h1 { font-size: 18px; margin: 0 12px 0 0; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
      .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
      button { background: #33373e; color: var(--text); border: 1px solid #4a4f58; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); color: #1d1f23; border-color: var(--accent); font-weight: 600; }
      label.slider { display: grid; grid-template-columns: 150px 1fr 64px; align-items: center; gap: 8px; margin: 4px 0; }
      label.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      label.check { display: inline-flex; align-items: center; gap: 6px; margin: 4px 12px 4px 0; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      #status { color: var(--muted); }
      #meter { font: 12px/1.5 ui-monospace, Consolas, monospace; display: flex; flex-wrap: wrap; gap: 18px; }
      #meter .bar { width: 220px; height: 10px; background: #15171a; border-radius: 5px; overflow: hidden; align-self: center; }
      #meter .fill { height: 100%; width: 0; background: linear-gradient(90deg, #5fd17a, var(--accent) 75%, var(--warn)); }
      table { width: 100%; border-collapse: collapse; font: 12px/1.4 ui-monospace, Consolas, monospace; }
      th, td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--line); }
      th:first-child, td:first-child { text-align: left; }
      td.bad { color: var(--warn); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Audio Lab</h1>
        <button id="unlock" class="primary" disabled>Ton starten</button>
        <span id="status">Klangbank wird erzeugt …</span>
      </header>
      <section>
        <h2>Ausgang (hinter dem Limiter)</h2>
        <div id="meter"></div>
      </section>
      <div class="grid">
        <section>
          <h2>Raumklänge</h2>
          <div id="world-controls"></div>
          <div id="world-buttons" class="buttons"></div>
        </section>
        <section>
          <h2>Oberfläche</h2>
          <div id="ui-buttons" class="buttons"></div>
          <h2 style="margin-top: 14px">Probe</h2>
          <div id="test-buttons" class="buttons"></div>
        </section>
        <section>
          <h2>Biene und Fliege</h2>
          <div id="loop-controls"></div>
        </section>
        <section>
          <h2>Umgebung und Lautstärke</h2>
          <div id="environment-controls"></div>
        </section>
      </div>
      <section>
        <h2>Klangbank</h2>
        <div id="bank"></div>
      </section>
    </main>
    <script type="module" src="/src/systems/audio/demo/audioLab.ts"></script>
  </body>
</html>
