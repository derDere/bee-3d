# docker/spacetimedb/config.toml -- versionierte Serverkonfiguration (SpacetimeDB 2.10.2).
# Wird beim Containerstart nach /stdb/data/config.toml kopiert; Aenderungen brauchen einen Neustart.

[logs]
# Der beim ersten Start erzeugte Standard schaltet debug fuer die SpacetimeDB-Crates ein.
level = "info"
directives = [
    "spacetimedb=info",
    "spacetimedb_standalone=info",
    "spacetimedb_client_api=warn",
]

[module-http]
# Keine ausgehenden HTTP-Requests aus Prozeduren oder Handlern (ab 2.9.0).
enabled = false

[websocket]
ping-interval = "15s"
idle-timeout = "30s"
close-handshake-timeout = "250ms"
# Pro Client: so viele unverarbeitete Nachrichten, dann wird die Verbindung geschlossen.
incoming-queue-length = 4096

[wasm]
procedure-instance-pool-size = 2

[v8]
procedure-instance-pool-size = 2

[v8-heap-policy]
heap-check-request-interval = 65536
heap-check-time-interval = "30s"
heap-gc-trigger-fraction = 0.67
heap-retire-fraction = 0.75
heap-limit-mb = 0

[commitlog]
max-segment-size = 1073741824
write-buffer-size = 131072
