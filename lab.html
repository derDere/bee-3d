<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2d31; }
      #lab-canvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; display: block; }
      #lab-overlay { position: fixed; inset: 0; pointer-events: none; font: 12px/1.2 ui-monospace, Consolas, monospace; color: #f2f2f2; }
      .lab-header { position: absolute; left: 0; right: 0; top: 0; box-sizing: border-box; padding: 4px 8px; background: #1b1c1f; white-space: nowrap; overflow: hidden; }
      .lab-tile { position: absolute; box-sizing: border-box; border: 1px solid #55585f; }
      .lab-tile > span { position: absolute; left: 4px; top: 4px; padding: 2px 6px; background: rgba(20, 21, 24, 0.78); border-radius: 3px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <canvas id="lab-canvas"></canvas>
    <div id="lab-overlay"></div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
