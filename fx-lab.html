<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FX Lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #050913; color: #e9edf5; font: 12px/1.35 "Segoe UI", system-ui, sans-serif; }
      #fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #fx-stats { position: fixed; left: 8px; top: 8px; padding: 6px 9px; background: rgba(6, 10, 20, 0.78); border: 1px solid #263252; border-radius: 6px; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; }
      #fx-panel { position: fixed; right: 8px; top: 8px; bottom: 8px; width: 236px; overflow-y: auto; padding: 8px; box-sizing: border-box; background: rgba(6, 10, 20, 0.82); border: 1px solid #263252; border-radius: 6px; }
      #fx-panel h2 { margin: 10px 0 5px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8fa3cc; }
      #fx-panel h2:first-child { margin-top: 0; }
      #fx-panel .row { display: flex; flex-wrap: wrap; gap: 4px; }
      #fx-panel button { flex: 1 1 auto; min-width: 64px; padding: 4px 6px; border: 1px solid #34436b; border-radius: 4px; background: #121a2e; color: #e9edf5; font: inherit; cursor: pointer; }
      #fx-panel button:hover { background: #1b2744; }
      #fx-panel button.on { background: #6b4b0f; border-color: #c99a2e; }
      #fx-panel label { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
      #fx-panel input[type="range"] { flex: 1; }
      #fx-panel .value { width: 44px; text-align: right; font-family: ui-monospace, Consolas, monospace; }
      #fx-error { position: fixed; inset: 30% 20% auto 20%; padding: 16px; background: rgba(40, 10, 10, 0.92); border: 1px solid #ff6b5a; border-radius: 8px; white-space: pre-wrap; font: 13px/1.4 ui-monospace, Consolas, monospace; display: none; }
    </style>
  </head>
  <body>
    <canvas id="fx-canvas"></canvas>
    <div id="fx-stats"></div>
    <div id="fx-panel"></div>
    <div id="fx-error"></div>
    <script type="module" src="/src/entities/effects/demo/fxLab.ts"></script>
  </body>
</html>
