[project]
name = "game-models"
version = "0.1.0"
description = "Generatoren für die 3D-Modelle des Spiels (Modell-Pipeline)."
# xatlas (UV-Abwicklung) liefert Wheels nur bis Python 3.13 (Stand: xatlas 0.0.11, 2025-07-04)
requires-python = ">=3.13,<3.14"
dependencies = [
    "embreex>=4.4.0",
    "manifold3d>=3.5.4",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pygltflib>=1.16.5",
    "pymeshlab>=2025.7.post1",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "trimesh>=5.1.0",
    "xatlas>=0.0.11",
]

[tool.uv]
package = false
