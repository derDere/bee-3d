<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HUD demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1a33; }
      /* Gemalter Himmel statt 3D-Szene, damit die Oberfläche vor einem passenden Hintergrund steht */
      #demo-scene {
        position: fixed;
        inset: 0;
        outline: none;
        touch-action: none;
        background:
          radial-gradient(ellipse 26% 11% at 18% 64%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 70%),
          radial-gradient(ellipse 20% 9% at 31% 59%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 70%),
          radial-gradient(ellipse 34% 13% at 79% 68%, rgba(255, 249, 242, 0.85), rgba(255, 255, 255, 0) 70%),
          radial-gradient(ellipse 16% 7% at 61% 41%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 70%),
          radial-gradient(ellipse 12% 5% at 44% 30%, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 70%),
          radial-gradient(ellipse 130% 32% at 50% 102%, rgba(251, 247, 241, 0.98), rgba(251, 247, 241, 0) 62%),
          linear-gradient(180deg, #2f6db3 0%, #5a93d1 36%, #9cc4ea 60%, #e9dcc8 80%, #f6f1ea 100%);
      }
      /* Am rechten Rand, damit der Reiter Seitenleiste, Nearby-Karte und Kompass links frei lässt */
      #demo-dock {
        position: fixed;
        right: 0;
        top: 50%;
        z-index: 20;
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        transform: translateY(-50%);
        font: 12px/1.3 system-ui, sans-serif;
        color: #3b2a18;
      }
      #demo-dock::before {
        content: "Demo";
        padding: 10px 4px;
        border-radius: 6px 0 0 6px;
        background: rgba(255, 245, 220, 0.9);
        writing-mode: vertical-rl;
        letter-spacing: 0.05em;
      }
      .demo-panel {
        display: none;
        flex-direction: column;
        gap: 4px;
        padding: 8px;
        margin-right: 4px;
        border: 2px solid #5b3a1e;
        border-radius: 10px;
        background: #fff5dc;
      }
      #demo-dock:hover .demo-panel,
      #demo-dock:focus-within .demo-panel { display: flex; }
      .demo-title { font-weight: 700; color: #b8650a; }
      .demo-panel button {
        padding: 4px 8px;
        border: 1px solid rgba(91, 58, 30, 0.35);
        border-radius: 6px;
        background: #fffaf0;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .demo-panel button.is-current { border-color: #e08a1e; background: #ffe7b0; }
      .demo-touch { white-space: pre; color: #7a5a3a; font-size: 11px; }
      .demo-icons {
        position: fixed;
        inset: 40px 60px;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 6px;
        overflow: auto;
        padding: 14px;
        border: 3px solid #5b3a1e;
        border-radius: 18px;
        background: #fff5dc;
        font: 11px/1.2 system-ui, sans-serif;
        color: #5b3a1e;
      }
      .demo-icons[hidden] { display: none; }
      .demo-icons figure { margin: 0; display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border-radius: 10px; background: #fffaf0; }
      .demo-icons svg { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="demo-scene" tabindex="0" aria-label="Game scene placeholder"></div>
    <div id="hud"></div>
    <div id="demo-dock"></div>
    <script type="module" src="/src/hud/demo/hudDemo.ts"></script>
  </body>
</html>
